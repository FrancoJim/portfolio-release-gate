name: Deploy demo
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_IN_AUTOMATION: 'true'
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.12.2
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Init remote state
        run: terraform -chdir=infra init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="key=release-gate/demo.tfstate" -backend-config="region=$AWS_REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra plan -input=false -out=deploy.tfplan
      - run: terraform -chdir=infra apply -input=false deploy.tfplan
      - name: Verify live service
        run: |
          URL=$(terraform -chdir=infra output -raw url)
          python scripts/smoke.py "$URL"
          echo "Demo URL: $URL" >> "$GITHUB_STEP_SUMMARY"
